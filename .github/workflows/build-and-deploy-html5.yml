name: Build and Deploy HTML5

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Defold Bob
        run: |
          curl -L https://d.defold.com/stable/Bob/bob.jar --output bob.jar

      - name: Build HTML5 bundle
        run: |
          java -jar bob.jar \
            --platform html5 \
            --variant release \
            --bundle-output build/html5 \
            --archive \
            --strip-executable \
            resolve build bundle

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: build/html5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

      - name: Show public game URL
        run: echo "Public game URL: ${{ steps.deployment.outputs.page_url }}"
